server:
  port: 8443
  address: stevedev-local
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: password
    key-store-type: PKCS12
    key-alias: my-ssl-key

spring:
  thymeleaf:
    cache: false

  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            client-name: Auth0
            provider: auth0
            authorization-grant-type: authorization_code
            # Spring Security uses this as the redirect URI for the callback
#            redirect-uri: "https://localhost:8443/login/oauth2/code/auth0"
            redirect-uri: "https://stevedev-local:8443/login/oauth2/code/auth0"
#            redirect-uri: "https://httpbin.org/anything"
            scope:
              - openid
              - profile
              - email
              # add any API scopes you need here (e.g., read write)

          # Second registration: same Auth0 app but forces the Keycloak connection.
          # Auth0 skips its own login form and goes straight to Keycloak.
          # Requires OAUTH2_AUTHZ_URI_KEYCLOAK=https://<auth0-domain>/authorize?connection=keycloak-alpha
          # Also register https://stevedev-local:8443/login/oauth2/code/auth0-keycloak
          # as an Allowed Callback URL in the Auth0 application.
          auth0-keycloak:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            client-name: Auth0 (Keycloak federated)
            provider: auth0-keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "https://stevedev-local:8443/login/oauth2/code/auth0-keycloak"
            scope:
              - openid
              - profile
              - email

          # Third registration: same Auth0 app but scoped to a specific Auth0 organization.
          # Requires OAUTH2_ORG_ID=<auth0-org-id> (e.g. org_HIEqnJwKqn595kRF)
          # Also register https://stevedev-local:8443/login/oauth2/code/auth0-org
          # as an Allowed Callback URL in the Auth0 application.
          auth0-org:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            client-name: Auth0 (Organization)
            provider: auth0-org
            authorization-grant-type: authorization_code
            redirect-uri: "https://stevedev-local:8443/login/oauth2/code/auth0-org"
            scope:
              - openid
              - profile
              - email

        provider:
          auth0:
            # Forces Auth0's local user database, bypassing Home Realm Discovery.
            # Without this, Auth0 HRD auto-routes @ensono.com users to Keycloak.
            # The 'connection' parameter is injected via ConnectionAwareRequestResolver in SecurityConfig.
            issuer-uri: ${OAUTH2_ISSUER_URI}

          auth0-keycloak:
            # Same tenant — OIDC discovery provides token/userinfo/jwks endpoints.
            # The 'connection' parameter is injected via ConnectionAwareRequestResolver in SecurityConfig.
            issuer-uri: ${OAUTH2_ISSUER_URI}

          auth0-org:
            # Same tenant — the 'organization' parameter is injected via ConnectionAwareRequestResolver.
            issuer-uri: ${OAUTH2_ISSUER_URI}

# Optional: If used, this needs to be defined as one of the logout URIs on ForgeRock
app:
  post-logout-redirect-uri: "https://stevedev-local:8443/"
  introspection-uri: ${APP_INTROSPECTION_URI:}
  # Connection names passed as additionalParameters to Auth0's /authorize endpoint.
  # Override via env vars if your connection names differ.
  connections:
    auth0: ${OAUTH2_CONNECTION_DIRECT:Username-Password-Authentication}
    auth0-keycloak: ${OAUTH2_CONNECTION_KEYCLOAK:keycloak-alpha}
  # Auth0 organization ID; set OAUTH2_ORG_ID=<your-org-id> to enable org-scoped login
  organizations:
    auth0-org: ${OAUTH2_ORG_ID:}

logging:
  level:
    "org.springframework.security.oauth2": DEBUG
    "org.springframework.web.client": DEBUG
    "org.springframework.http.client": DEBUG
